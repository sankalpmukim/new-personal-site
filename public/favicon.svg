<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect fill="#e3ecd9" width="64" height="64" rx="14"/>
  <!-- bicycle -->
  <g fill="none" stroke-width="3.4">
    <circle stroke="#142a4c" cx="15" cy="50" r="8.5"/>
    <circle stroke="#142a4c" cx="47" cy="50" r="8.5"/>
  </g>
  <path d="M15 50 L29 49 L24 37 Z M24 37 L41 36 L29 49 M41 36 L47 50" fill="none" stroke="#c0186f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M41 36 L43 30 L47 30" fill="none" stroke="#142a4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- leg -->
  <path d="M25 37 L33 42 L29 49" fill="none" stroke="#e2731b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="24" cy="31" rx="12.5" ry="8" transform="rotate(-14 24 31)" fill="#fff" stroke="#142a4c" stroke-width="2.6"/>
  <!-- neck -->
  <path d="M30 26 C36 20 27 16 32 10" fill="none" stroke="#142a4c" stroke-width="8" stroke-linecap="round"/>
  <path d="M30 26 C36 20 27 16 32 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- pouch + beak -->
  <path d="M35 11 Q42 23 60 12 Z" fill="#f7c35c" stroke="#142a4c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34 7.5 L61 10.5 Q62.5 12 60.5 13 L34 12 Z" fill="#f2a11f" stroke="#142a4c" stroke-width="2" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="32" cy="9.5" r="5" fill="#fff" stroke="#142a4c" stroke-width="2.4"/>
  <circle cx="33.6" cy="8.6" r="1.5" fill="#142a4c"/>
  <!-- wing to handlebar -->
  <path d="M15 30 Q30 26 44 31 L40 34 Q28 33 18 35 Z" fill="#d6dfea" stroke="#142a4c" stroke-width="2" stroke-linejoin="round"/>
</svg>
